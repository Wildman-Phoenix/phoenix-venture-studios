name: Phoenix RSS Shadow Validation

on:
  workflow_dispatch:
    inputs:
      run_slot:
        description: "Shadow run label"
        required: false
        default: "manual"
      handoff_id:
        description: "BOSS shadow handoff ID"
        required: false
        default: ""
      queue_revision:
        description: "Expected immutable queue revision"
        required: false
        default: ""
      bundle_hash:
        description: "Expected immutable bundle SHA-256"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/phoenix-rss-shadow-validation.yml"
      - ".github/workflows/phoenix-rss-daily-production.yml"
      - "apps/phoenix-venture-studios-rebuild/**"

permissions:
  contents: read

concurrency:
  group: phoenix-rss-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build shadow bundle
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.handoff_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/phoenix-venture-studios-rebuild
    env:
      PHOENIX_RSS_SITE_URL: https://phoenixventurestudios.com
      SITE_URL: https://phoenixventurestudios.com
      VITE_BASE_PATH: /
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: shadow-validation-only
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      ALLOW_TEST_TURNSTILE: "1"
      PHOENIX_RSS_RUN_SLOT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_slot || 'manual' }}

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: apps/phoenix-venture-studios-rebuild/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run RSS regression suite
        run: npm run rss:test

      - name: Validate preserved public bundle
        run: npm run rss:validate

      - name: Generate shadow candidate
        id: rss_run
        run: npm run rss:autonomous

      - name: Validate shadow candidate
        run: npm run rss:validate

      - name: Prepare deploy-shaped artifact
        if: steps.rss_run.outputs.output_changed == 'true'
        run: npm run prepare:production

      - name: Prepare preview-shaped artifact
        if: steps.rss_run.outputs.output_changed == 'true'
        run: npm run rss:publish-preview

      - name: Validate deploy-shaped artifact
        if: steps.rss_run.outputs.output_changed == 'true'
        run: node scripts/rss/validate-rss-output.mjs --deploy-artifacts

      - name: Preserve shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-rss-shadow-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/phoenix-venture-studios-rebuild/public/rss
            apps/phoenix-venture-studios-rebuild/public/images/signals/generated
            apps/phoenix-venture-studios-rebuild/dist/rss

  gate4:
    name: BOSS Gate 4 shadow handoff
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.handoff_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/phoenix-venture-studios-rebuild
    env:
      PHOENIX_RSS_SITE_URL: https://phoenixventurestudios.com
      SITE_URL: https://phoenixventurestudios.com
      VITE_BASE_PATH: /
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: shadow-validation-only
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      ALLOW_TEST_TURNSTILE: "1"
      PHOENIX_RSS_RUN_SLOT: manual
      PHOENIX_GATE4_BASE_URL: https://bos.risingphoenixai.tech
      PHOENIX_GATE4_HANDOFF_ID: ${{ github.event.inputs.handoff_id }}
      PHOENIX_GATE4_QUEUE_REVISION: ${{ github.event.inputs.queue_revision }}
      PHOENIX_GATE4_BUNDLE_HASH: ${{ github.event.inputs.bundle_hash }}

    steps:
      - name: Check out shadow worker
        uses: actions/checkout@v4

      - name: Use pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: apps/phoenix-venture-studios-rebuild/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve and verify immutable BOSS handoff
        id: resolve
        env:
          PHOENIX_GATE4_HANDOFF_SECRET: ${{ secrets.PHOENIX_BOSS_HANDOFF_SECRET }}
        run: node scripts/rss/gate4-handoff-contract.mjs fetch

      - name: Run RSS regression suite
        id: test
        run: |
          node --test scripts/rss/gate4-handoff-contract.test.mjs
          npm run rss:test

      - name: Hydrate last valid public bundle
        id: hydrate
        run: npm run rss:hydrate-live

      - name: Validate preserved public bundle
        id: preserved
        run: npm run rss:validate

      - name: Generate shadow candidate
        id: generate
        run: npm run rss:autonomous

      - name: Validate shadow candidate
        id: validate
        run: npm run rss:validate

      - name: Prepare deploy-shaped artifact
        id: prepare
        if: steps.generate.outputs.output_changed == 'true'
        run: npm run prepare:production

      - name: Prepare preview-shaped artifact
        id: preview
        if: steps.generate.outputs.output_changed == 'true'
        run: npm run rss:publish-preview

      - name: Validate deploy-shaped artifact
        id: parity
        if: steps.generate.outputs.output_changed == 'true'
        run: node scripts/rss/validate-rss-output.mjs --deploy-artifacts

      - name: Assert no-public-write shadow boundary
        id: boundary
        run: |
          node -e 'if (process.env.CLOUDFLARE_API_TOKEN || process.env.CLOUDFLARE_ACCOUNT_ID) throw new Error("deploy credentials must not exist in Gate 4")'

      - name: Return Gate 4 evidence to BOSS
        if: always()
        env:
          PHOENIX_GATE4_HANDOFF_SECRET: ${{ secrets.PHOENIX_BOSS_HANDOFF_SECRET }}
          PHOENIX_GATE4_OUTPUT_CHANGED: ${{ steps.generate.outputs.output_changed || 'false' }}
          PHOENIX_GATE4_STEP_RESULTS: >-
            {"resolve":"${{ steps.resolve.outcome }}","test":"${{ steps.test.outcome }}","hydrate":"${{ steps.hydrate.outcome }}","preserved":"${{ steps.preserved.outcome }}","generate":"${{ steps.generate.outcome }}","validate":"${{ steps.validate.outcome }}","prepare":"${{ steps.prepare.outcome }}","preview":"${{ steps.preview.outcome }}","parity":"${{ steps.parity.outcome }}","boundary":"${{ steps.boundary.outcome }}"}
        run: node scripts/rss/gate4-handoff-contract.mjs report

      - name: Preserve Gate 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-rss-gate4-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/phoenix-venture-studios-rebuild/.gate4
            apps/phoenix-venture-studios-rebuild/public/rss
            apps/phoenix-venture-studios-rebuild/public/images/signals/generated
            apps/phoenix-venture-studios-rebuild/dist/rss
